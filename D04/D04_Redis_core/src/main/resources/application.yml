server:
  port: 8080

spring:
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ai_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: #无密码留空
      database: 0

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.zl.d04.entity # todo 重命名包名，此处需要手动修改
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# D03
# Knife4j 配置
knife4j:
  enable: true
  openapi:
    title: AI智能知识助手
    description: 阶段1工程骨架接口
    version: 1.0.0
  # 生产环境可设置为false关闭文档
#  production: false
# D04追加配置：Redisson分布式锁业务参数
redisson:
  singleServerConfig:
    lockWatchdogTimeout: 30000 # 锁看门狗超时：业务执行超时自动续期，默认30秒
    connectionMinimumIdleSize: 2 # 最小空闲连接数，复用连接池


