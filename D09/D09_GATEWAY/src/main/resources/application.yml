server:
  port: 9000

spring:
  application:
    name: d09-gateway

  # Nacos 服务发现：网关据此获取 Provider/Consumer 实例列表
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        # 本地 Nacos 已启动，可保持 fail-fast 默认；如遇环境问题可临时置 false
        fail-fast: false

    # Spring Cloud 2025.0.0 起，网关配置统一收敛到 gateway.server.webflux 下
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # 不自动按服务名创建路由（显式配置更清晰），需要时可置 true
              enabled: false

          # 全局默认过滤器：对所有路由生效的 Redis 令牌桶限流
          default-filters:
            - name: RequestRateLimiter
              args:
                # 令牌补充速率：每秒 1 个（便于快速触发限流）
                redis-rate-limiter.replenishRate: 1
                # 桶容量：最多允许 2 个突发请求
                redis-rate-limiter.burstCapacity: 2
                # 每个请求消耗 1 个令牌
                redis-rate-limiter.requestedTokens: 1
                # 限流维度：按客户端 IP（SpEL 引用名为 ipKeyResolver 的 Bean）
                key-resolver: "#{@ipKeyResolver}"

          # 显式路由：通过 lb://服务名 走负载均衡转发
          routes:
            - id: provider-route
              uri: lb://d09-provider
              predicates:
                # 保留 /provider 前缀，Provider 接口路径即 /provider/**
                - Path=/provider/**
            - id: consumer-route
              uri: lb://d09-consumer
              predicates:
                - Path=/consumer/**

  # 限流使用的 Redis 连接
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
