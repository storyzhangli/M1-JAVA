server:
  port: 8081

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true # 开启断路器
      client:
        config:
          inventory-service:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: BASIC

# Resilience4j断路器配置
resilience4j:
  circuitbreaker:
    instances:
      "InventoryClient#getInventory(Long)":
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2