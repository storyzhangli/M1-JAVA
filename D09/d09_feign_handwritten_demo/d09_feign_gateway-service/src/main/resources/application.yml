server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: order_route
          uri: [http://localhost:8081](http://localhost:8081)
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=2 # 剥离/api前缀，转发到订单服务